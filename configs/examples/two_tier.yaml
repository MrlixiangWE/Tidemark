# A phone (llama.cpp) plus a server (vLLM). The common "assistant falls back
# to the device when the link drops" deployment.

scheduler:
  listen: "0.0.0.0:7420"
  alpha: 1.0
  kappa: 2
  beta: 0.5

admission:
  intervals: [256, 512, 1024]
  gamma: 0.03

engines:
  - engine_id: phone
    model: meta-llama/Llama-3.2-1B-Instruct
    tier: device
    backend: llamacpp
    endpoint: http://192.168.1.50:8080
    runtime_config: llamacpp-q4km-4k
    tau_fg_ms_per_ktok: 2560
    tau_bg_ms_per_ktok: 2330
    kv_bytes_per_token: 32768
    tpot_ref_ms: 48
  - engine_id: server
    model: Qwen/Qwen2.5-14B-Instruct
    tier: cloud
    backend: vllm
    endpoint: http://10.0.0.10:8000
    runtime_config: vllm-bf16-32k-apc
    tau_fg_ms_per_ktok: 191
    tau_bg_ms_per_ktok: 73
    kv_bytes_per_token: 98304
    tpot_ref_ms: 9
