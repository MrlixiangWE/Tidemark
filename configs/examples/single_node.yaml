# Two vLLM engines on one machine, for trying Tidemark out on a single GPU box.
# Point both at different ports; the "device" model here is just a small model.

scheduler:
  listen: "127.0.0.1:7420"
  kappa: 2
  beta: 1.0        # one tenant, so let it use the whole background budget

engines:
  - engine_id: small
    model: Qwen/Qwen2.5-1.5B-Instruct
    tier: device
    backend: vllm
    endpoint: http://127.0.0.1:8001
    tau_fg_ms_per_ktok: 120
    tau_bg_ms_per_ktok: 55
    kv_bytes_per_token: 28672
    tpot_ref_ms: 6.0
  - engine_id: large
    model: Qwen/Qwen2.5-7B-Instruct
    tier: cloud
    backend: vllm
    endpoint: http://127.0.0.1:8002
    tau_fg_ms_per_ktok: 260
    tau_bg_ms_per_ktok: 105
    kv_bytes_per_token: 57344
    tpot_ref_ms: 11.0
