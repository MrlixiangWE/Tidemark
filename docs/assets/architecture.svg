<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Tidemark architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
    <style>
      .b  { fill:#fff; stroke:#333; stroke-width:1.2; }
      .bl { fill:#eef3f8; stroke:#333; stroke-width:1.2; }
      .bg { fill:#f5f5f5; stroke:#333; stroke-width:1.2; }
      .h  { fill:#111; font-size:14px; font-weight:bold; }
      .t  { fill:#333; font-size:12px; }
      .s  { fill:#555; font-size:11px; }
      .o  { fill:#b45309; font-size:11px; }
      .l  { stroke:#333; stroke-width:1.2; fill:none; }
    </style>
  </defs>
  <rect width="760" height="420" fill="#fff"/>

  <!-- application -->
  <rect x="280" y="20" width="200" height="44" class="bg"/>
  <text x="380" y="47" text-anchor="middle" class="h">Application / router</text>
  <line x1="380" y1="64" x2="380" y2="110" class="l" marker-end="url(#a)"/>
  <text x="390" y="92" class="s">served turns, next-model probabilities</text>

  <!-- Tidemark -->
  <rect x="60" y="110" width="640" height="150" class="bl"/>
  <text x="76" y="132" class="h">Tidemark</text>

  <rect x="90" y="150" width="200" height="86" class="b"/>
  <text x="190" y="186" text-anchor="middle" class="h">Frontier catalog</text>
  <text x="190" y="206" text-anchor="middle" class="t">per session × model</text>

  <line x1="290" y1="193" x2="320" y2="193" class="l" marker-end="url(#a)"/>

  <rect x="320" y="150" width="200" height="86" class="b"/>
  <text x="420" y="186" text-anchor="middle" class="h">Frontier scheduler</text>
  <text x="420" y="206" text-anchor="middle" class="t">rank · cap · issue</text>

  <line x1="550" y1="172" x2="520" y2="180" class="l" marker-end="url(#a)"/>
  <line x1="550" y1="214" x2="520" y2="206" class="l" marker-end="url(#a)"/>
  <rect x="550" y="150" width="120" height="38" class="b"/>
  <text x="610" y="174" text-anchor="middle" class="t">router signal</text>
  <rect x="550" y="198" width="120" height="38" class="b"/>
  <text x="610" y="222" text-anchor="middle" class="t">engine rates</text>

  <!-- tickets / results -->
  <g stroke="#b45309" stroke-width="1.3">
    <line x1="150" y1="260" x2="150" y2="318" marker-end="url(#ao)"/>
    <line x1="370" y1="260" x2="370" y2="318" marker-end="url(#ao)"/>
    <line x1="590" y1="260" x2="590" y2="318" marker-end="url(#ao)"/>
  </g>
  <g stroke="#333" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="180" y1="318" x2="180" y2="260" marker-end="url(#a)"/>
    <line x1="400" y1="318" x2="400" y2="260" marker-end="url(#a)"/>
    <line x1="620" y1="318" x2="620" y2="260" marker-end="url(#a)"/>
  </g>
  <text x="412" y="282" class="o">tickets</text>
  <text x="412" y="300" class="s">commit / cancel</text>

  <!-- engines -->
  <rect x="60" y="318" width="200" height="82" class="b"/>
  <text x="160" y="352" text-anchor="middle" class="h">Device</text>
  <text x="160" y="372" text-anchor="middle" class="t">llama.cpp + adapter</text>

  <rect x="280" y="318" width="200" height="82" class="b"/>
  <text x="380" y="352" text-anchor="middle" class="h">Edge</text>
  <text x="380" y="372" text-anchor="middle" class="t">vLLM + admission shim</text>

  <rect x="500" y="318" width="200" height="82" class="b"/>
  <text x="600" y="352" text-anchor="middle" class="h">Cloud</text>
  <text x="600" y="372" text-anchor="middle" class="t">vLLM + admission shim</text>
</svg>
