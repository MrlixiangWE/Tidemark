<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Tidemark architecture">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .box { fill:#0f172a; stroke:#334155; stroke-width:1.5; }
      .box2 { fill:#111a33; stroke:#3b4a6b; stroke-width:1.2; }
      .t { fill:#e2e8f0; font-size:15px; font-weight:600; }
      .s { fill:#94a3b8; font-size:12.5px; }
      .m { fill:#cbd5e1; font-size:12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .num { fill:#0b1220; font-size:12px; font-weight:800; }
      .lbl { fill:#f59e0b; font-size:12px; font-weight:600; }
      .lbl2 { fill:#22d3ee; font-size:12px; font-weight:600; }
    </style>
  </defs>
  <rect width="960" height="520" rx="18" fill="#0b1220"/>

  <!-- router -->
  <rect x="380" y="24" width="200" height="54" rx="10" class="box"/>
  <text x="480" y="47" text-anchor="middle" class="t">Application router</text>
  <text x="480" y="66" text-anchor="middle" class="s">picks the serving model per turn</text>

  <!-- Tidemark box -->
  <rect x="60" y="120" width="840" height="200" rx="14" class="box"/>
  <text x="84" y="147" class="t" style="font-size:16px">Tidemark runtime layer</text>
  <text x="285" y="147" class="s">off the foreground path · runs on an edge module</text>

  <!-- catalog -->
  <rect x="84" y="166" width="250" height="130" rx="10" class="box2"/>
  <circle cx="106" cy="188" r="10" fill="#22d3ee"/><text x="106" y="192" text-anchor="middle" class="num">1</text>
  <text x="124" y="193" class="t">Versioned KV frontier catalog</text>
  <text x="100" y="218" class="m" style="font-size:11.5px">F : (s, m, c) ↦ &lt;r, F, L, q, g&gt;</text>
  <text x="100" y="240" class="s">per session × model × runtime config</text>
  <text x="100" y="258" class="s">appends extend · edits retract to LCP</text>
  <text x="100" y="276" class="s">evictions retract · generations invalidate</text>

  <!-- scheduler -->
  <rect x="356" y="166" width="300" height="130" rx="10" class="box2"/>
  <circle cx="378" cy="188" r="10" fill="#22d3ee"/><text x="378" y="192" text-anchor="middle" class="num">2</text>
  <text x="396" y="193" class="t">Global frontier scheduler</text>
  <text x="372" y="218" class="m">Score(a) = B(a) / R(a)</text>
  <text x="372" y="240" class="s">latency removed per unit of background compute</text>
  <text x="372" y="258" class="s">Δmax = min(1024, lag) · tenant caps κ, β · aging</text>
  <text x="372" y="276" class="s">one atomic ticket per engine per epoch</text>

  <!-- predictor / rates -->
  <rect x="678" y="166" width="198" height="58" rx="10" class="box2"/>
  <text x="694" y="188" class="t" style="font-size:13.5px">Destination predictor</text>
  <text x="694" y="208" class="m" style="font-size:11.5px">p = α·p_router + (1−α)·p_hist</text>
  <rect x="678" y="238" width="198" height="58" rx="10" class="box2"/>
  <text x="694" y="260" class="t" style="font-size:13.5px">Per-engine rate table</text>
  <text x="694" y="280" class="m" style="font-size:11.5px">τ_fg, τ_bg fitted per engine</text>

  <!-- internal arrows -->
  <line x1="334" y1="231" x2="356" y2="231" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="248" text-anchor="middle" class="s" style="font-size:10px">lagging</text>
  <line x1="678" y1="195" x2="656" y2="210" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="678" y1="267" x2="656" y2="252" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- router -> tidemark -->
  <line x1="480" y1="78" x2="480" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="102" class="s">turn served on m · p(next destination)</text>

  <!-- engines -->
  <g id="engines">
    <rect x="60" y="380" width="250" height="112" rx="12" class="box"/>
    <circle cx="82" cy="402" r="10" fill="#22d3ee"/><text x="82" y="406" text-anchor="middle" class="num">3</text>
    <text x="100" y="407" class="t">Device · llama.cpp</text>
    <text x="84" y="430" class="s">commit / reject adapter</text>
    <text x="84" y="448" class="s">single slot: Idle or Blocked</text>
    <text x="84" y="470" class="m" style="font-size:11.5px">τ_bg/τ_fg ≈ 0.91</text>

    <rect x="355" y="380" width="250" height="112" rx="12" class="box"/>
    <circle cx="377" cy="402" r="10" fill="#22d3ee"/><text x="377" y="406" text-anchor="middle" class="num">3</text>
    <text x="395" y="407" class="t">Edge · vLLM V1</text>
    <text x="379" y="430" class="s">admission shim in the scheduler iteration</text>
    <text x="379" y="448" class="s">X_t safe budget · Idle / Mixed / Blocked</text>
    <text x="379" y="470" class="m" style="font-size:11.5px">τ_bg/τ_fg ≈ 0.47</text>

    <rect x="650" y="380" width="250" height="112" rx="12" class="box"/>
    <circle cx="672" cy="402" r="10" fill="#22d3ee"/><text x="672" y="406" text-anchor="middle" class="num">3</text>
    <text x="690" y="407" class="t">Cloud · vLLM V1</text>
    <text x="674" y="430" class="s">admission shim in the scheduler iteration</text>
    <text x="674" y="448" class="s">≤ 1 interval from D = {256, 512, 1024}</text>
    <text x="674" y="470" class="m" style="font-size:11.5px">τ_bg/τ_fg ≈ 0.38</text>
  </g>

  <!-- tickets down -->
  <line x1="170" y1="320" x2="170" y2="380" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <line x1="480" y1="320" x2="480" y2="380" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <line x1="790" y1="320" x2="790" y2="380" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrowAmber)"/>
  <text x="492" y="345" class="lbl">atomic ticket &lt;u, s, m, c, e, r, g, [F, F+Δmax)&gt;</text>

  <!-- results up -->
  <line x1="215" y1="380" x2="215" y2="320" stroke="url(#wave)" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="525" y1="380" x2="525" y2="320" stroke="url(#wave)" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <line x1="835" y1="380" x2="835" y2="320" stroke="url(#wave)" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
  <text x="537" y="365" class="lbl2">committed(Δ, h) · cancelled · refused · then Valid(a)?</text>
</svg>
