<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Tidemark architecture">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
    <style>
      .b  { fill:#fff; stroke:#333; stroke-width:1.2; }
      .bl { fill:#eef3f8; stroke:#333; stroke-width:1.2; }
      .bg { fill:#f5f5f5; stroke:#333; stroke-width:1.2; }
      .h  { fill:#111; font-size:14px; font-weight:bold; }
      .t  { fill:#111; font-size:12.5px; }
      .s  { fill:#444; font-size:11.5px; }
      .c  { fill:#111; font-size:11.5px; font-family: Menlo, Consolas, 'Courier New', monospace; }
      .n  { fill:#fff; font-size:11px; font-weight:bold; }
      .o  { fill:#b45309; font-size:11.5px; }
      .l  { stroke:#333; stroke-width:1.2; fill:none; }
    </style>
  </defs>
  <rect width="900" height="470" fill="#fff"/>

  <!-- router -->
  <rect x="345" y="18" width="210" height="46" class="bg"/>
  <text x="450" y="38" text-anchor="middle" class="h">Application router</text>
  <text x="450" y="55" text-anchor="middle" class="s">chooses the model that serves each turn</text>
  <line x1="450" y1="64" x2="450" y2="104" class="l" marker-end="url(#a)"/>
  <text x="460" y="88" class="s">turn served on m,  p(next destination)</text>

  <!-- Tidemark layer -->
  <rect x="40" y="104" width="820" height="196" class="bl"/>
  <text x="56" y="126" class="h">Tidemark</text>
  <text x="130" y="126" class="s">runtime layer between the router and the engines; not on the request path</text>

  <!-- catalog -->
  <rect x="60" y="142" width="300" height="140" class="b"/>
  <circle cx="78" cy="160" r="9" fill="#333"/><text x="78" y="164" text-anchor="middle" class="n">1</text>
  <text x="94" y="164" class="h">Versioned KV frontier catalog</text>
  <text x="76" y="188" class="c" style="font-size:10.5px">(session, model, config) → ⟨r, F, L, q, g⟩</text>
  <text x="76" y="212" class="t">How far each non-serving model's reusable</text>
  <text x="76" y="228" class="t">prefix reaches, and which revision it is valid for.</text>
  <text x="76" y="252" class="s">turn served → other models marked lagging</text>
  <text x="76" y="268" class="s">edit / eviction → retract, bump generation</text>

  <!-- scheduler -->
  <rect x="384" y="142" width="300" height="140" class="b"/>
  <circle cx="402" cy="160" r="9" fill="#333"/><text x="402" y="164" text-anchor="middle" class="n">2</text>
  <text x="418" y="164" class="h">Global frontier scheduler</text>
  <rect x="400" y="180" width="82" height="30" class="bg"/><text x="441" y="199" text-anchor="middle" class="s">lagging</text>
  <rect x="492" y="180" width="82" height="30" class="bg"/><text x="533" y="199" text-anchor="middle" class="s">score, rank</text>
  <rect x="584" y="180" width="84" height="30" class="bg"/><text x="626" y="199" text-anchor="middle" class="s">issue tickets</text>
  <line x1="482" y1="195" x2="492" y2="195" class="l" marker-end="url(#a)"/>
  <line x1="574" y1="195" x2="584" y2="195" class="l" marker-end="url(#a)"/>
  <text x="400" y="232" class="c" style="font-size:10.5px">score = latency saved / bg compute time</text>
  <text x="400" y="252" class="s">Δmax = min(1024, lag);  per-tenant caps κ, β;  aging</text>
  <text x="400" y="268" class="s">at most one ticket in flight per engine</text>

  <!-- side inputs -->
  <rect x="700" y="142" width="148" height="60" class="b"/>
  <text x="774" y="160" text-anchor="middle" class="t">router signal</text>
  <text x="774" y="177" text-anchor="middle" class="c" style="font-size:10px">p = α·p_router</text>
  <text x="774" y="192" text-anchor="middle" class="c" style="font-size:10px">+ (1−α)·p_hist</text>
  <rect x="700" y="222" width="148" height="60" class="b"/>
  <text x="774" y="243" text-anchor="middle" class="t">per-engine rates</text>
  <text x="774" y="261" text-anchor="middle" class="c" style="font-size:10.5px">τ_fg, τ_bg per engine</text>
  <line x1="700" y1="172" x2="684" y2="180" class="l" marker-end="url(#a)"/>
  <line x1="700" y1="252" x2="684" y2="244" class="l" marker-end="url(#a)"/>

  <!-- catalog -> scheduler -->
  <line x1="360" y1="212" x2="384" y2="212" class="l" marker-end="url(#a)"/>

  <!-- tickets down / results up -->
  <g stroke="#b45309" stroke-width="1.3">
    <line x1="170" y1="300" x2="170" y2="352" marker-end="url(#ao)"/>
    <line x1="450" y1="300" x2="450" y2="352" marker-end="url(#ao)"/>
    <line x1="730" y1="300" x2="730" y2="352" marker-end="url(#ao)"/>
  </g>
  <g stroke="#333" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="200" y1="352" x2="200" y2="300" marker-end="url(#a)"/>
    <line x1="480" y1="352" x2="480" y2="300" marker-end="url(#a)"/>
    <line x1="760" y1="352" x2="760" y2="300" marker-end="url(#a)"/>
  </g>
  <text x="488" y="318" class="o">atomic ticket: advance [F, F+Δmax) for (session, model)</text>
  <text x="488" y="338" class="s">result: committed (Δ, hash) · cancelled · refused  →  Valid(a)?</text>

  <!-- engines -->
  <g>
    <rect x="40" y="352" width="260" height="98" class="b"/>
    <circle cx="58" cy="370" r="9" fill="#333"/><text x="58" y="374" text-anchor="middle" class="n">3</text>
    <text x="74" y="374" class="h">Device engine  ·  llama.cpp</text>
    <text x="56" y="398" class="t">commit / reject adapter</text>
    <text x="56" y="416" class="s">single slot: Idle or Blocked</text>
    <text x="56" y="436" class="c" style="font-size:10.5px">τ_bg / τ_fg ≈ 0.91</text>

    <rect x="320" y="352" width="260" height="98" class="b"/>
    <circle cx="338" cy="370" r="9" fill="#333"/><text x="338" y="374" text-anchor="middle" class="n">3</text>
    <text x="354" y="374" class="h">Edge engine  ·  vLLM</text>
    <text x="336" y="398" class="t">admission shim in the scheduler step</text>
    <text x="336" y="416" class="s">safe budget X_t; Idle / Mixed / Blocked</text>
    <text x="336" y="436" class="c" style="font-size:10.5px">τ_bg / τ_fg ≈ 0.47</text>

    <rect x="600" y="352" width="260" height="98" class="b"/>
    <circle cx="618" cy="370" r="9" fill="#333"/><text x="618" y="374" text-anchor="middle" class="n">3</text>
    <text x="634" y="374" class="h">Cloud engine  ·  vLLM</text>
    <text x="616" y="398" class="t">admission shim in the scheduler step</text>
    <text x="616" y="416" class="s">≤ 1 interval per step from {256, 512, 1024}</text>
    <text x="616" y="436" class="c" style="font-size:10.5px">τ_bg / τ_fg ≈ 0.38</text>
  </g>
</svg>
